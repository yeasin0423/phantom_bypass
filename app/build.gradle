plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phantom.manager'
    compileSdk 34

    defaultConfig {
        applicationId "com.phantom.manager"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// No external dependencies: the manager talks to the module through
// /data/adb/phantom/ files using the Magisk su binary.
