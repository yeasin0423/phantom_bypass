name: Build Phantom Bypass

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android@v3 is intentionally NOT used.
      # It runs `sdkmanager tools`, a package Google removed from the SDK
      # manifest, which fails the whole job. The GitHub ubuntu-latest runner
      # already ships the Android SDK (ANDROID_HOME + cmdline-tools).

      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.3.11579264"

      - name: Compile hooker DEX (Java -> classes.dex -> dex_bytes.h)
        run: |
          command -v xxd >/dev/null 2>&1 || sudo apt-get install -y -qq xxd
          mkdir -p build/hooker-classes build/dex
          javac -source 8 -target 8 -nowarn \
            -bootclasspath "$ANDROID_HOME/platforms/android-34/android.jar" \
            $(find hooker/src -name '*.java') \
            -d build/hooker-classes
          "$ANDROID_HOME/build-tools/34.0.0/d8" --release --min-api 24 \
            --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
            --output build/dex \
            $(find build/hooker-classes -name '*.class')
          # xxd -i derives the C identifiers from the PATH. Running from
          # build/dex with the bare filename yields `classes_dex` and
          # `classes_dex_len` — exactly the names phantom.cpp expects.
          # (Redirect happens in the repo root shell, so the output path
          # is relative to the repo root, not build/dex.)
          (cd build/dex && xxd -i classes.dex) > zygisk/src/dex_bytes.h
          echo "dex_bytes.h size: $(stat -c%s zygisk/src/dex_bytes.h)"

      - name: Build Zygisk module (arm64-v8a / armeabi-v7a / x86_64 / x86)
        run: |
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "=== building $ABI ==="
            cmake -S zygisk -B "build/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            # --target phantom: builds libphantom.so + its dependency graph
            # (dobby_static, lsplant_static) and SKIPS Dobby's macOS-only
            # macho_ctx_kit targets, which cannot compile off Darwin.
            cmake --build "build/$ABI" --target phantom -j 4
            ls -la "build/$ABI/libphantom.so"
          done

      # The preinstalled Gradle on ubuntu-latest is 9.x, which is NOT
      # compatible with AGP 8.1.4 (Gradle 9 removed DependencyHandler.module()
      # that AGP still calls during configuration). Install Gradle 8.7
      # explicitly via the official Gradle action and build with that.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Phantom Manager APK
        run: |
          gradle --version | head -6
          gradle --no-daemon :app:assembleDebug

      - name: Package Magisk module zip
        run: |
          mkdir -p dist/zygisk
          cp module/module.prop module/customize.sh module/service.sh \
             module/post-fs-data.sh module/uninstall.sh module/action.sh \
             module/system.prop dist/
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "build/$ABI/libphantom.so" "dist/zygisk/$ABI.so"
          done
          cp zygisk/src/dex_bytes.h dist/dex_bytes.h.bak 2>/dev/null || true
          rm -f dist/dex_bytes.h.bak
          cd dist && zip -r ../Phantom-Bypass-Magisk-Module.zip . && cd ..
          unzip -l Phantom-Bypass-Magisk-Module.zip

      - name: Collect artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Phantom-Manager.apk
          ls -la Phantom-Bypass-Magisk-Module.zip Phantom-Manager.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phantom-bypass
          path: |
            Phantom-Bypass-Magisk-Module.zip
            Phantom-Manager.apk
          if-no-files-found: error

      - name: Create release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Phantom-Bypass-Magisk-Module.zip
            Phantom-Manager.apk
